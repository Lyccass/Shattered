<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shattered Prototype</title>
    <link rel="stylesheet" href="/ui.css" />
    <style>
      html,
      body,
      #game {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #080d17;
      }

      #game {
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      canvas {
        display: block;
        image-rendering: auto;
      }
    </style>
  </head>
  <body>
    <div id="game">
      <!-- HTML UI overlay — sits on top of the Phaser canvas -->
      <div id="ui-overlay"></div>
    </div>
    <script type="module" src="/src/apps/game/main.ts"></script>
  </body>
</html>
